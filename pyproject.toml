[project]
name = "fix-zensical"
version = "0.1.0"
description = "Add click-to-zoom Mermaid diagrams, full-screen tables and layout toggles to a Zensical docs site."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
fix-zensical = "fix_zensical.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fix_zensical"]

[tool.pytest.ini_options]
pythonpath = ["src"]
