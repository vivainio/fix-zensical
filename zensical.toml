[project]
site_name = "fix-zensical"
site_description = "Reading tools for Zensical sites: zoomable Mermaid diagrams, full-screen tables, layout toggles."
site_url = "https://vivainio.github.io/fix-zensical/"
docs_dir = "docs"
repo_url = "https://github.com/vivainio/fix-zensical"
repo_name = "vivainio/fix-zensical"

nav = [
  { "Home" = "index.md" },
  { "Diagrams" = "diagrams.md" },
  { "Tables" = "tables.md" },
]

[project.theme]
features = ["navigation.top", "content.code.copy"]

# Follow the operating system's light or dark setting, with a header toggle
# that cycles system, light and dark.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions.tables]
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
